<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Piano</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="video">
      <video src="./assets/bg.webm" autoplay loop muted>
        video not supported
      </video>
    </div>

    <h1>Virtual Piano</h1>

    <div id="showKeys">
      <div id="myKeys"></div>
      <div id="bottomKeys">
        <div class="keyXC"></div>
      </div>
    </div>

    <div id="piano">
      <!-- Octave 1: C3 to B3 -->
      <div id="key" class="key white" data-note="C3">C</div>
      <div id="keyMid" class="key black mid-black" data-note="C#3">
        C#<br />Db
      </div>
      <div id="key" class="key white" data-note="D3">D</div>
      <div id="keyMid" class="key black mid-black" data-note="D#3">
        D#<br />Eb
      </div>
      <div id="key" class="key white" data-note="E3">E</div>
      <div id="key" class="key white" data-note="F3">F</div>
      <div id="keyMid" class="key black mid-black" data-note="F#3">
        F#<br />Gb
      </div>
      <div id="key" class="key white" data-note="G3">G</div>
      <div id="keyMid" class="key black mid-black" data-note="G#3">
        G#<br />Ab
      </div>
      <div id="key" class="key white" data-note="A3">A</div>
      <div id="keyMid" class="key black mid-black" data-note="A#3">
        A#<br />Bb
      </div>
      <div id="key" class="key white" data-note="B3">B</div>

      <!-- Octave 2: C4 to B4 -->
      <div id="key" class="key white" data-note="C4">C</div>
      <div id="keyMid" class="key black mid-black" data-note="C#4">
        C#<br />Db
      </div>
      <div id="key" class="key white" data-note="D4">D</div>
      <div id="keyMid" class="key black mid-black" data-note="D#4">
        D#<br />Eb
      </div>
      <div id="key" class="key white" data-note="E4">E</div>
      <div id="key" class="key white" data-note="F4">F</div>
      <div id="keyMid" class="key black mid-black" data-note="F#4">
        F#<br />Gb
      </div>
      <div id="key" class="key white" data-note="G4">G</div>
      <div id="keyMid" class="key black mid-black" data-note="G#4">
        G#<br />Ab
      </div>
      <div id="key" class="key white" data-note="A4">A</div>
      <div id="keyMid" class="key black mid-black" data-note="A#4">
        A#<br />Bb
      </div>
      <div id="key" class="key white" data-note="B4">B</div>

      <!-- Octave 3: C5 to B5 -->
      <div id="key" class="key white" data-note="C5">C</div>
      <div id="keyMid" class="key black mid-black" data-note="C#5">
        C#<br />Db
      </div>
      <div id="key" class="key white" data-note="D5">D</div>
      <div id="keyMid" class="key black mid-black" data-note="D#5">
        D#<br />Eb
      </div>
      <div id="key" class="key white" data-note="E5">E</div>
      <div id="key" class="key white" data-note="F5">F</div>
      <div id="keyMid" class="key black mid-black" data-note="F#5">
        F#<br />Gb
      </div>
      <div id="key" class="key white" data-note="G5">G</div>
      <div id="keyMid" class="key black mid-black" data-note="G#5">
        G#<br />Ab
      </div>
      <div id="key" class="key white" data-note="A5">A</div>
      <div id="keyMid" class="key black mid-black" data-note="A#5">
        A#<br />Bb
      </div>
      <div id="key" class="key white" data-note="B5">B</div>
    </div>
    <script src="./src/index.js"></script>
  </body>
</html>
